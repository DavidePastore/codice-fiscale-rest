name: Continuous Integration

on: [push, pull_request]

jobs:
  quality:
    runs-on: ${{ matrix.operating-system }}
    strategy:
      matrix:
        operating-system: [ubuntu-latest]
        php-version: ['8.2', '8.3', '8.4', '8.5']
        node-version: [22.x, 24.x, 26.x]
    name: PHP ${{ matrix.php-version }} | Node ${{ matrix.node-version }} Test on ${{ matrix.operating-system }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      
      - name: Install PHP
        uses: shivammathur/setup-php@v2
        with:
            php-version: ${{ matrix.php-version }}
      
      - name: Check PHP Version
        run: php -v

      - name: Install dependencies
        run: composer install --prefer-dist --no-progress

      - name: PHP Unit tests
        run: vendor/bin/phpunit --coverage-text --coverage-clover=coverage.clover
      
      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node-version }}
      
      - name: Install NPM dependencies
        run: npm install
      
      - name: Build Fomantic-UI
        run: |
          cd node_modules/fomantic-ui
          npx gulp install
      
      - name: Compile assets
        run: npm run dev
      
      - name: Upload code coverage data
        run: |
          composer global require scrutinizer/ocular --no-progress --no-interaction
          php "$(composer global config bin-dir --absolute --quiet)/ocular" code-coverage:upload --format=php-clover coverage.clover
